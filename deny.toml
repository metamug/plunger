# Checked in CI by `cargo deny check` (the "Supply chain" job in .github/workflows/ci.yml).
#
# advisories: fails on a RustSec advisory for a crate in Cargo.lock. An advisory that does not apply to how
#             Plunger uses a crate goes in `ignore` below with the reason, never silently.
# licenses:   only licences that allow shipping a closed-over binary under MIT are accepted. A dependency with
#             another licence fails the build until someone decides.
# bans/sources: warn on duplicate versions (egui pulls several), and only crates.io is a source.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
