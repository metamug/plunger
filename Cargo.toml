[package]
name = "plunger"
version = "0.6.0"
edition = "2021"
description = "Plunger: a quick, lightweight desktop tool for sending HTTP requests, with no CORS restrictions."
license = "MIT"
repository = "https://github.com/metamug/plunger"
homepage = "https://github.com/metamug/plunger"
readme = "README.md"
keywords = ["http", "api", "rest", "mcp", "curl"]
categories = ["development-tools", "command-line-utilities"]

[workspace]
members = [".", "crates/mcp-install"]

[[bin]]
name = "plunger"
path = "src/main.rs"

[dependencies]
mcp-install = { path = "crates/mcp-install", version = "0.1.0" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.36"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "rustls-no-provider"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
egui_json_tree = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
shell-words = "1"
rfd = { version = "0.17", default-features = false }
# The TLS provider reqwest uses: ring is far smaller than the aws-lc-rs that reqwest 0.13 picks by default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# Headless modes: read the GUI's saved state, and serve MCP over stdio.
ron = "0.12"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# winit needs a display backend on Linux; they load their libraries at run time,
# so the headless CLI and MCP modes still start on a server with no desktop.
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
# File dialogs go through the desktop portal: pure Rust, no GTK to install.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
