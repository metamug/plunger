[package]
name = "plunger"
version = "0.2.0"
edition = "2021"
description = "Plunger: a quick, lightweight desktop tool for sending HTTP requests, with no CORS restrictions."
license = "MIT"
repository = "https://github.com/metamug/plunger"

[[bin]]
name = "plunger"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls-native-roots"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
egui_json_tree = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
shell-words = "1"
rfd = { version = "0.15", default-features = false }
time = { version = "0.3", features = ["formatting"] }
# Headless modes: read the GUI's saved state, and serve MCP over stdio.
ron = "0.8"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
