<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-labelledby="t">
  <title id="t">A plunger</title>
  <defs>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="0.55" stop-color="#b37437"/>
      <stop offset="1" stop-color="#8d5726"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" x2="1">
      <stop offset="0" stop-color="#e2574c"/>
      <stop offset="0.6" stop-color="#c8372d"/>
      <stop offset="1" stop-color="#9e241c"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" x2="1">
      <stop offset="0" stop-color="#b8322a"/>
      <stop offset="1" stop-color="#861c15"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="246" rx="72" ry="8" fill="#000" opacity=".16"/>

  <!-- handle -->
  <rect x="91" y="14" width="18" height="150" rx="9" fill="url(#wood)"/>
  <circle cx="100" cy="30" r="4" fill="#6b421c"/>
  <path d="M96 48 L96 150 M104 70 L104 150" stroke="#8d5726" stroke-width="1.2" opacity=".45" stroke-linecap="round"/>

  <!-- rubber neck -->
  <path d="M88 150 h24 l4 18 h-32 z" fill="#9e241c"/>

  <!-- cup -->
  <path d="M34 236 C34 196 62 162 100 162 C138 162 166 196 166 236 Z" fill="url(#rubber)"/>
  <path d="M52 222 C54 196 72 178 94 173" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".28"/>

  <!-- lip -->
  <ellipse cx="100" cy="237" rx="68" ry="9" fill="url(#lip)"/>
</svg>
