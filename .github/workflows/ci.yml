name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (test, lint, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --locked
      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: plunger-windows
          path: target/release/plunger.exe
          if-no-files-found: error

  # Linux: tests, lint and a release build, then the real binary is run headlessly
  # the way it would be on a server (CLI against a local server, and an MCP handshake).
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Headless smoke test
        run: scripts/smoke-cli.sh target/release/plunger
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: plunger-linux-x86_64
          path: target/release/plunger
          if-no-files-found: error

  # macOS is not built or tested yet; this only reports whether the code compiles.
  other-platforms:
    name: Compile check (macOS, not supported yet)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
