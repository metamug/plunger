name: Release

# Push a tag like v0.1.1 to publish. Running it by hand (Actions tab > Release >
# Run workflow) does a dry run: it builds and uploads the zip as a build
# artifact, but does not touch any GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the macOS builds to this existing release (for example v0.5.2). Leave empty for a dry run."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag does not match Cargo.toml version $version. Bump the version, or retag." }

      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/plunger.exe -DestinationPath dist/plunger-windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/plunger-windows.zip -Algorithm SHA256).Hash
          "$hash  plunger-windows.zip" | Set-Content dist/plunger-windows.zip.sha256
          "SHA-256 $hash"

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plunger-windows-zip
          path: dist/*
          if-no-files-found: error

      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release was already drafted by hand: just attach the files.
            gh release upload $tag dist/plunger-windows.zip dist/plunger-windows.zip.sha256 --clobber
          } else {
            gh release create $tag dist/plunger-windows.zip dist/plunger-windows.zip.sha256 --title "Plunger $($tag.TrimStart('v'))" --generate-notes --latest
          }

  # Runs after the Windows job so the release already exists when this attaches to it.
  linux:
    name: Build and publish (Linux)
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Headless smoke test
        run: scripts/smoke-cli.sh target/release/plunger

      - name: Package
        run: |
          mkdir -p dist/plunger
          cp target/release/plunger LICENSE README.md dist/plunger/
          tar -C dist -czf dist/plunger-linux-x86_64.tar.gz plunger
          (cd dist && sha256sum plunger-linux-x86_64.tar.gz > plunger-linux-x86_64.tar.gz.sha256 && cat plunger-linux-x86_64.tar.gz.sha256)

      - name: Keep the tarball as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plunger-linux-tarball
          path: dist/plunger-linux-x86_64.tar.gz*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/plunger-linux-x86_64.tar.gz dist/plunger-linux-x86_64.tar.gz.sha256 --clobber

  # The binary is not signed or notarized yet: a browser download gets a Gatekeeper warning
  # (right-click > Open, or `xattr -d com.apple.quarantine plunger`); curl and pip installs do not.
  macos:
    name: Build and publish (macOS ${{ matrix.arch }})
    needs: windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7

      - name: The release to attach to must be this version
        if: inputs.release_tag != ''
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "${{ inputs.release_tag }}" = "v$version" ] || { echo "Release ${{ inputs.release_tag }} does not match Cargo.toml version $version"; exit 1; }

      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Headless smoke test
        run: scripts/smoke-cli.sh target/release/plunger

      - name: Package
        run: |
          mkdir -p dist/plunger
          cp target/release/plunger LICENSE README.md dist/plunger/
          tar -C dist -czf dist/plunger-macos-${{ matrix.arch }}.tar.gz plunger
          (cd dist && shasum -a 256 plunger-macos-${{ matrix.arch }}.tar.gz > plunger-macos-${{ matrix.arch }}.tar.gz.sha256 && cat plunger-macos-${{ matrix.arch }}.tar.gz.sha256)

      - name: Keep the tarball as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plunger-macos-${{ matrix.arch }}-tarball
          path: dist/plunger-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" dist/plunger-macos-${{ matrix.arch }}.tar.gz dist/plunger-macos-${{ matrix.arch }}.tar.gz.sha256 --clobber

  # One app for both kinds of Mac: the two builds above joined into a universal Plunger.app, in a disk image.
  macos-app:
    name: Build and publish (macOS app and disk image)
    needs: macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: plunger-macos-*-tarball
          path: builds
          merge-multiple: true

      - name: Build Plunger.app and the disk image
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p arm x86 out
          tar -xzf builds/plunger-macos-arm64.tar.gz -C arm
          tar -xzf builds/plunger-macos-x86_64.tar.gz -C x86
          packaging/macos/build-app.sh "$version" out arm/plunger/plunger x86/plunger/plunger
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The app is universal, signed, and starts
        run: |
          APP=out/Plunger.app
          lipo -info "$APP/Contents/MacOS/plunger" | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          codesign -dv "$APP" 2>&1 | head -5
          plutil -lint "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/plunger" --version
          export PLUNGER_DATA_DIR=$(mktemp -d)
          "$APP/Contents/MacOS/plunger" &
          pid=$!
          sleep 6
          kill -0 $pid && echo "the window stayed up" || { echo "the window exited"; exit 1; }
          kill $pid || true
          # the disk image mounts and holds the app
          hdiutil attach "out/Plunger-$VERSION-macos.dmg" -mountpoint /tmp/plunger-dmg -nobrowse -quiet
          ls /tmp/plunger-dmg
          test -d /tmp/plunger-dmg/Plunger.app
          hdiutil detach /tmp/plunger-dmg -quiet

      - name: Keep the disk image as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plunger-macos-dmg
          path: |
            out/Plunger-*-macos.dmg
            out/Plunger-*-macos.dmg.sha256
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" "out/Plunger-$VERSION-macos.dmg" "out/Plunger-$VERSION-macos.dmg.sha256" --clobber
