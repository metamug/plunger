name: Demo video

# Records the real window on a macOS runner, driven by real keyboard and mouse events, and turns the
# frames into a captioned video and GIF. Start it by hand: Actions > Demo video > Run workflow.
# The files are in the run's artifacts. It does not publish anything.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  record:
    name: Record on macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked

      - name: Tools for the captions and the encoder
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet imageio imageio-ffmpeg pillow numpy

      - name: Record the window
        run: |
          chmod +x scripts/demo/record-macos.sh
          scripts/demo/record-macos.sh target/release/plunger demo-out

      - name: Add the captions and encode
        run: .venv/bin/python scripts/demo/compose.py demo-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-video
          path: |
            demo-out/plunger-demo.mp4
            demo-out/plunger-demo.gif
          if-no-files-found: warn

      - name: Keep the raw recording and the scene screenshots, for checking
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-raw
          path: |
            demo-out/*.png
            demo-out/clip.mov
            demo-out/markers.txt
            demo-out/geometry.txt
            demo-out/start.txt
            demo-out/recorder-err.txt
            demo-out/osascript-err.txt
            demo-out/app-stdout.txt
          if-no-files-found: warn
